name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: capstoneflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Giá trị chỉ dùng trong CI, không phải bí mật thật. Secret production nằm ở Vercel.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/capstoneflow_ci
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/capstoneflow_ci
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      BETTER_AUTH_URL: http://localhost:3100
      SEED_PASSWORD: ci-demo-password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cài dependencies (kèm prisma generate)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + component test
        run: npx vitest run

      - name: Áp migration vào database CI
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Cài trình duyệt cho Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npx playwright test

      - name: Lưu báo cáo Playwright khi E2E lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
